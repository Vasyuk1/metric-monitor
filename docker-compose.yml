

services:
  postgres:
    image: postgres:15
    container_name: postgres
    environment:
      POSTGRES_USER: metrics
      POSTGRES_PASSWORD: metrics
      POSTGRES_DB: metrics
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - monitor-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U metrics"]
      interval: 5s
      timeout: 5s
      retries: 5

  core:
    build:
      context: ./core
      dockerfile: Dockerfile
    command: python main.py --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    volumes:
      - core-data:/app
      - /etc/localtime:/etc/localtime:ro
    environment:
      - TZ=Europe/Moscow
    networks:
      - monitor-net
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:latest
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus-data:/prometheus
    networks:
      - monitor-net
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - grafana-data:/var/lib/grafana
    networks:
      - monitor-net
    restart: unless-stopped

networks:
  monitor-net:
    driver: bridge

volumes:
  postgres-data:
  core-data:
  prometheus-data:
  grafana-data: